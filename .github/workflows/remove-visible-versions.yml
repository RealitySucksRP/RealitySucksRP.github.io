name: Clean storefront labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-visible-versions.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean storefront
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    <div class="hero-right">
      <div class="neon-card">
        <p>Current Release Signal</p>
        <strong>Still Building.</strong>
        <span>The public tools keep moving forward while the commercial ecosystem keeps getting deeper.</span>
        <div class="signal-list">
          <div><b>RS Bridge</b><span>v2.4.0</span></div>
          <div><b>Punk Inventory</b><span>v3.0.3</span></div>
          <div><b>Zombie Inventory</b><span>v3.0.2</span></div>
          <div><b>ZombieCore</b><span>Enhanced listing live</span></div>
          <div><b>Server Packages</b><span>30 days support</span></div>
        </div>
      </div>
    </div>'''

          new = '''    <div class="hero-right">
      <div class="neon-card">
        <p>RealitySucksRP Tebex Store</p>
        <strong>Built By Me. Ready For Your Server.</strong>
        <span>Shop my FiveM systems for zombie survival, vehicles, racing, weapons, shops, phones, custom UI, Phantom encounters, warfare and more.</span>
        <div class="signal-list">
          <div><b>Zombie + Survival</b><span>Explore</span></div>
          <div><b>Vehicles + Racing</b><span>Explore</span></div>
          <div><b>Weapons + Shops</b><span>Explore</span></div>
          <div><b>Phantom + Warfare</b><span>Explore</span></div>
          <div><b>Phones + UI</b><span>Explore</span></div>
        </div>
        <a class="btn store" href="https://reality-sucks-rp-webstore.tebex.io/" target="_blank" rel="noopener noreferrer" style="margin-top:18px;">Browse The Full Store</a>
      </div>
    </div>'''

          if old not in s:
              raise SystemExit('Expected release box not found')
          s = s.replace(old, new, 1)

          s = re.sub(r'<span class="version">v\d+(?:\.\d+){1,3}(?:[-A-Za-z0-9._]+)?</span>', '', s)
          s = re.sub(r'\s+v\d+(?:\.\d+){1,3}(?:[-A-Za-z0-9._]+)?', '', s)

          if re.search(r'>v\d+(?:\.\d+){1,3}', s):
              raise SystemExit('Visible version label remains')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/remove-visible-versions.yml
          git add index.html .github/workflows/remove-visible-versions.yml
          git commit -m "Replace release box with Tebex storefront promo"
          git push origin main
