name: Organize storefront top

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/organize-storefront-top.yml'

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reorganize top storefront
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          nav = '''    <div class="nav-links">
      <a href="#packages">Server Packages</a>
      <a href="https://reality-sucks-rp-webstore.tebex.io/" target="_blank" rel="noopener noreferrer">Store</a>
      <a href="#outbreak">Zombie</a>
      <a href="#vehicles">Vehicles</a>
      <a href="#chaos">AI + Horror</a>
      <a href="#systems">RP Systems</a>
      <a href="#open-source">Free</a>
      <a href="https://discord.gg/e9V3rPHySx" target="_blank" rel="noopener noreferrer">Discord</a>
      <a href="https://www.youtube.com/@RealitySucksRP" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="store-link" href="https://reality-sucks-rp-webstore.tebex.io/" target="_blank" rel="noopener noreferrer">Browse Tebex</a>
    </div>'''
          s = re.sub(r'    <div class="nav-links">.*?    </div>', nav, s, count=1, flags=re.S)

          hero_copies = re.findall(r'      <p class="hero-copy">.*?</p>', s, flags=re.S)
          if len(hero_copies) >= 2:
              clean_copy = '''      <p class="hero-copy">
        I’m William, the developer behind RealitySucksRP. I build FiveM systems around memorable gameplay: outbreak worlds, cinematic threats, vehicle businesses, racing, phones, inventories, garages, shops, custom UI and framework-backed RP systems. Use one resource or build an entire connected server around the ecosystem.
      </p>'''
              s = s.replace(hero_copies[0] + '\n\n' + hero_copies[1], clean_copy, 1)

          first_buttons = re.search(r'      <div class="hero-buttons">.*?      </div>', s, flags=re.S)
          if first_buttons:
              buttons = '''      <div class="hero-buttons">
        <a class="btn store hero-store-btn" href="https://reality-sucks-rp-webstore.tebex.io/" target="_blank" rel="noopener noreferrer">Browse Tebex Store</a>
        <a class="btn primary" href="#packages">View Server Packages</a>
        <a class="btn ghost" href="https://discord.gg/e9V3rPHySx" target="_blank" rel="noopener noreferrer">Join Discord</a>
        <a class="btn ghost" href="https://www.youtube.com/@RealitySucksRP" target="_blank" rel="noopener noreferrer">YouTube</a>
      </div>'''
              s = s[:first_buttons.start()] + buttons + s[first_buttons.end():]

          badges = re.search(r'      <div class="hero-badges">.*?      </div>', s, flags=re.S)
          if badges:
              badge_html = '''      <div class="hero-badges">
        <span>Qbox • QBCore • ESX • Standalone</span>
        <span>Full Source Where Listed</span>
        <span>Enhanced Tested Where Listed</span>
        <span>Free + Premium Releases</span>
        <span>30-Day Support On Server Packages</span>
      </div>'''
              s = s[:badges.start()] + badge_html + s[badges.end():]

          hero_right = re.search(r'    <div class="hero-right">.*?    </div>\n  </header>', s, flags=re.S)
          if hero_right:
              store_card = '''    <div class="hero-right">
      <div class="neon-card store-spotlight">
        <p>RealitySucksRP Tebex Store</p>
        <strong>Build The Server You Actually Want.</strong>
        <span>Shop the full RealitySucksRP catalog: survival, vehicles, racing, cinematic AI, RP systems, phones, inventories, UI and utilities.</span>
        <div class="store-categories">
          <span>Zombie + Survival</span>
          <span>Vehicles + Racing</span>
          <span>AI + Cinematic</span>
          <span>RP + Economy</span>
          <span>Phones + UI</span>
          <span>Enhanced Releases</span>
        </div>
        <a class="btn store store-spotlight-cta" href="https://reality-sucks-rp-webstore.tebex.io/" target="_blank" rel="noopener noreferrer">Open Tebex Store</a>
        <small>Free releases available • Source access and compatibility listed per product</small>
      </div>
    </div>
  </header>'''
              s = s[:hero_right.start()] + store_card + s[hero_right.end():]

          # Cleaner package heading.
          s = s.replace('<p>Start Here • Complete FiveM Server Packages</p>', '<p>Complete FiveM Server Packages</p>', 1)
          s = s.replace('<h2>Want The Whole Foundation?</h2>', '<h2>Choose Your Foundation.</h2>', 1)
          s = re.sub(
              r'      <span>Three fixed server-package options.*?</span>\n      <div class="package-heading-actions">',
              '      <span>Three complete starting points for different kinds of servers. Every package includes organized setup, proper CFX-grant handling where required and 30 days of Discord support.</span>\n      <div class="package-heading-actions">',
              s,
              count=1,
              flags=re.S
          )

          # Replace package cards with shorter, scan-friendly versions.
          card1 = '''      <article class="package-card dev">
        <div class="package-art"><img src="images/qbcoreshell.png" alt="QBCore Shell FiveM server package"></div>
        <div class="package-top"><span class="label">Developer Foundation</span><strong class="price">$500</strong></div>
        <p class="special">Build From A Clean Base</p>
        <h3>QBCore Shell</h3>
        <p class="desc">For owners and developers who want an organized QBCore foundation ready to customize instead of starting with dependency chaos.</p>
        <div class="package-points">
          <span>321+ resources reviewed</span>
          <span>Load order + dependencies organized</span>
          <span>Bridge-aware integration paths</span>
          <span>Legacy + Enhanced review</span>
        </div>
        <div class="support-pill">30 Days Discord Setup Support</div>
        <a class="card-btn" href="https://discord.gg/e9V3rPHySx" target="_blank" rel="noopener noreferrer">Ask About QBCore Shell</a>
      </article>'''
          card2 = '''      <article class="package-card zombie">
        <div class="package-art"><img src="images/zombierp.png" alt="Zombie survival FiveM server package"></div>
        <div class="package-top"><span class="label">Zombie Survival</span><strong class="price">$700</strong></div>
        <p class="special">Complete Outbreak Foundation</p>
        <h3>Zombie Server</h3>
        <p class="desc">A complete apocalypse starting point built around the RealitySucksRP outbreak ecosystem—not a normal RP server with zombies dropped on top.</p>
        <div class="package-points">
          <span>ZombieCore outbreak gameplay</span>
          <span>Survivor economy + progression</span>
          <span>Zombie phone, garage, shop + UI options</span>
          <span>OneSync-focused systems</span>
        </div>
        <div class="support-pill">30 Days Discord Setup Support</div>
        <a class="card-btn" href="https://discord.gg/e9V3rPHySx" target="_blank" rel="noopener noreferrer">Ask About Zombie Server</a>
      </article>'''
          card3 = '''      <article class="package-card owner">
        <div class="package-art"><img src="images/full_server.png" alt="Full RP FiveM server package"></div>
        <div class="package-top"><span class="label">Complete RP</span><strong class="price">$850</strong></div>
        <p class="special">Open With A Real Foundation</p>
        <h3>Full RP Server</h3>
        <p class="desc">A broader roleplay foundation with the major gameplay layers already organized so you can focus on your city instead of assembling the basics.</p>
        <div class="package-points">
          <span>Jobs + economy + gangs</span>
          <span>Vehicles + racing + housing</span>
          <span>Custom UI + RS systems</span>
          <span>Integration + migration review</span>
        </div>
        <div class="support-pill">30 Days Discord Setup + Configuration Support</div>
        <a class="card-btn" href="https://discord.gg/e9V3rPHySx" target="_blank" rel="noopener noreferrer">Ask About Full RP Server</a>
      </article>'''

          package_block = re.search(r'    <div class="package-grid">.*?    </div>\n  </section>', s, flags=re.S)
          if package_block:
              new_grid = '    <div class="package-grid">\n' + card1 + '\n\n' + card2 + '\n\n' + card3 + '\n    </div>\n  </section>'
              s = s[:package_block.start()] + new_grid + s[package_block.end():]

          p.write_text(s, encoding='utf-8')

          css = Path('rs-storefront.css')
          c = css.read_text(encoding='utf-8')
          c += '''\n\n/* Organized storefront top — Sept 2026 */\n.topbar {\n  min-height: 88px;\n  padding: 12px 42px;\n}\n.nav-links {\n  gap: 15px;\n  flex-wrap: nowrap;\n}\n.nav-links a {\n  white-space: nowrap;\n}\n.hero {\n  min-height: 560px;\n  padding: 64px 70px;\n  grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr);\n  gap: 54px;\n}\n.hero-copy {\n  max-width: 760px;\n  margin: 24px 0 28px;\n}\n.hero-store-btn {\n  min-width: 210px;\n  box-shadow: 0 0 34px rgba(0,234,255,.30), 0 0 28px rgba(130,255,56,.12);\n}\n.store-spotlight {\n  min-height: 400px;\n  justify-content: center;\n  padding: 34px;\n  background:\n    radial-gradient(circle at 82% 12%, rgba(130,255,56,.13), transparent 30%),\n    radial-gradient(circle at 15% 88%, rgba(255,47,179,.16), transparent 34%),\n    linear-gradient(145deg, rgba(0,234,255,.07), rgba(139,92,255,.07)),\n    rgba(5,7,18,.88);\n}\n.store-spotlight > strong {\n  max-width: 520px;\n  font-size: clamp(44px, 4vw, 66px);\n  line-height: .92;\n}\n.store-spotlight > span {\n  max-width: 560px;\n  font-size: 15px;\n  line-height: 1.55;\n}\n.store-categories {\n  margin: 24px 0 22px;\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 9px;\n}\n.store-categories span {\n  padding: 10px 12px;\n  border-radius: 10px;\n  color: var(--cyan);\n  background: rgba(0,0,0,.28);\n  border: 1px solid var(--line);\n  font-size: 11px;\n  font-weight: 900;\n  text-transform: uppercase;\n  letter-spacing: .8px;\n}\n.store-spotlight-cta {\n  width: 100%;\n  margin-top: 2px;\n}\n.store-spotlight small {\n  margin-top: 12px;\n  color: var(--muted-2);\n  text-align: center;\n  line-height: 1.4;\n}\n.priority-packages {\n  margin-top: 42px;\n  padding: 40px 30px 34px;\n}\n.priority-packages .section-heading {\n  max-width: 920px;\n  margin: 0 auto 30px;\n}\n.priority-packages .section-heading h2 {\n  margin-top: 7px;\n  font-size: clamp(48px, 5vw, 76px);\n}\n.package-grid {\n  align-items: stretch;\n  gap: 22px;\n}\n.package-card {\n  display: flex;\n  flex-direction: column;\n  padding: 16px;\n}\n.package-art {\n  height: 220px;\n}\n.package-top {\n  margin-top: 15px;\n}\n.package-card h3 {\n  font-size: 41px;\n}\n.package-card .desc {\n  min-height: 66px;\n  margin-bottom: 14px;\n}\n.package-points {\n  display: grid;\n  gap: 8px;\n  margin: 4px 0 16px;\n}\n.package-points span {\n  position: relative;\n  padding: 9px 10px 9px 28px;\n  border-radius: 10px;\n  color: var(--muted);\n  background: rgba(255,255,255,.035);\n  border: 1px solid rgba(255,255,255,.07);\n  font-size: 12px;\n  line-height: 1.35;\n}\n.package-points span::before {\n  content: '✓';\n  position: absolute;\n  left: 10px;\n  color: var(--green);\n  font-weight: 900;\n}\n.support-pill {\n  margin-top: auto;\n  margin-bottom: 12px;\n  padding: 11px 12px;\n  border-radius: 10px;\n  color: #071307;\n  background: linear-gradient(90deg, var(--green), var(--cyan));\n  text-align: center;\n  text-transform: uppercase;\n  font-size: 11px;\n  font-weight: 900;\n  letter-spacing: .75px;\n}\n.priority-packages .card-btn {\n  min-height: 46px;\n  background: linear-gradient(90deg, rgba(255,47,179,.16), rgba(0,234,255,.10));\n}\n@media (max-width: 1350px) {\n  .nav-links { gap: 10px; }\n  .nav-links a { font-size: 10px; }\n}\n@media (max-width: 1100px) {\n  .nav-links { flex-wrap: wrap; }\n  .hero { grid-template-columns: 1fr; }\n  .store-spotlight { min-height: 0; }\n}\n@media (max-width: 760px) {\n  .hero { padding: 38px 22px; }\n  .store-categories { grid-template-columns: 1fr; }\n  .priority-packages { padding: 26px 14px; }\n  .package-art { height: 200px; }\n}\n'''
          css.write_text(c, encoding='utf-8')
          PY

      - name: Commit organized storefront and remove workflow
        shell: bash
        run: |
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/organize-storefront-top.yml
          git add index.html rs-storefront.css .github/workflows/organize-storefront-top.yml
          git commit -m "Organize storefront hero and server packages"
          git push origin main
