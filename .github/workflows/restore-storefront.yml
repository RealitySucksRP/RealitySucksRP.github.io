name: Restore previous storefront

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-storefront.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore good storefront
        run: |
          git checkout 728911fc65e55003006585b776ed8a37b7fb8250 -- index.html rs-storefront.css
          rm -f .github/workflows/restore-storefront.yml
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html rs-storefront.css .github/workflows/restore-storefront.yml
          git commit -m "Restore previous storefront design"
          git push origin main
